name: Build & Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          JAVA_MAJOR_VERSION=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F '.' '{print $1}')
          if [ -z "$JAVA_MAJOR_VERSION" ]; then
            echo "Error: Failed to detect Java major version."
            exit 1
          fi
          echo "Detected Java major version: $JAVA_MAJOR_VERSION"
          if [ "$JAVA_MAJOR_VERSION" -lt 17 ]; then
            echo "Error: Java major version must be 17 or newer. Found: $JAVA_MAJOR_VERSION"
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f ./debug.keystore ]; then
            echo "./debug.keystore already exists."
          else
            echo "Generating temporary debug keystore..."
            keytool -genkey -v -keystore ./debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f ./debug.keystore ]; then
            echo "Error: Keystore could not be created."
            exit 1
          fi
          echo "./debug.keystore exists and is ready."

      - name: Build the debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify the APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "Error: Expected debug APK not found at $EXPECTED_APK"
            echo "Listing APK paths discovered inside app/build/outputs/apk:"
            find app/build/outputs/apk -name "*.apk" 2>/dev/null || true
            exit 1
          fi
          if [ ! -s "$EXPECTED_APK" ]; then
            echo "Error: APK file is empty: $EXPECTED_APK"
            exit 1
          fi
          case "$EXPECTED_APK" in
            *.apk) ;;
            *) echo "Error: File does not have .apk extension: $EXPECTED_APK"; exit 1 ;;
          esac
          echo "Successfully verified APK: $EXPECTED_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          RELEASE_DIR=$(mktemp -d)
          REPO_RAW="${{ github.repository }}"
          REPO_NAME=$(basename "$REPO_RAW" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g' | sed -E 's/^-+|-+$//g')
          if [ -z "$REPO_NAME" ]; then
            REPO_NAME="android-app"
          fi
          ASSET_FILENAME="${REPO_NAME}-debug-build-${{ github.run_number }}.apk"
          ASSET_PATH="${RELEASE_DIR}/${ASSET_FILENAME}"
          cp "app/build/outputs/apk/debug/app-debug.apk" "$ASSET_PATH"
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Failed to prepare release asset: $ASSET_PATH"
            exit 1
          fi
          echo "Prepared release asset: $ASSET_PATH"
          echo "asset_path=$ASSET_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_filename=$ASSET_FILENAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: create_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Release asset does not exist or is empty: $ASSET_PATH"
            exit 1
          fi
          case "$ASSET_PATH" in
            *.apk) ;;
            *) echo "Error: Release asset is not an APK: $ASSET_PATH"; exit 1 ;;
          esac

          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"

          NOTES_FILE=$(mktemp)
          cat << 'EOF' > "$NOTES_FILE"
          ### Automated Debug APK
          - **Build**: Built automatically by GitHub Actions
          - **Run Number**: ${{ github.run_number }}
          - **Run Attempt**: ${{ github.run_attempt }}
          - **Commit SHA**: ${{ github.sha }}
          - **Target Device**: Android
          - **Purpose**: Testing & QA
          - **Notice**: This APK is signed with a temporary debug keystore and is not intended for Google Play Store production release.
          EOF

          gh release create "$TAG_NAME" \
            "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes-file "$NOTES_FILE" \
            --target "${{ github.sha }}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_OUTCOME="${{ steps.create_release.outcome }}"
          ASSET_FILENAME="${{ steps.prepare_asset.outputs.asset_filename }}"
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          REPO_URL="https://github.com/${{ github.repository }}"

          echo "## Android Debug APK Build Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Artifact**: \`app-debug-apk\` (Available in Actions Summary)" >> "$GITHUB_STEP_SUMMARY"

          if [ "$RELEASE_OUTCOME" = "success" ]; then
            RELEASE_URL="${REPO_URL}/releases/tag/${TAG_NAME}"
            DOWNLOAD_URL="${REPO_URL}/releases/download/${TAG_NAME}/${ASSET_FILENAME}"
            echo "Release successfully published!"
            echo "Tag: $TAG_NAME"
            echo "Release URL: $RELEASE_URL"
            echo "Direct APK Download: $DOWNLOAD_URL"
            gh release view "$TAG_NAME" || true

            echo "- **Release Status**: Published" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Release Tag**: \`$TAG_NAME\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Release Page**: [$RELEASE_TITLE]($RELEASE_URL)" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Direct APK Download Link**: [$ASSET_FILENAME]($DOWNLOAD_URL)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "You can download the APK file directly to your phone using the release link above." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing failed or was skipped. The debug APK artifact is still available in the Actions summary."
            echo "- **Release Status**: ⚠️ Publishing failed or skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Fallback**: Download the APK from the **Artifacts** section at the bottom of the workflow run summary." >> "$GITHUB_STEP_SUMMARY"
          fi
